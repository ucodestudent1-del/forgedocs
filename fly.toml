# Fly.io Configuration
# Deploy to Fly.io with: fly deploy

app: "forgedocs"
primary_region: "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[processes]
  app = "node_modules/.bin/next start"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1