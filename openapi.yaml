openapi: 3.0.0
info:
  title: ForgeDocs API
  version: 1.0.0
  description: ForgeDocs document management platform API
servers:
  - url: https://api.forgedocs.com
    description: Production server
  - url: http://localhost:3000
    description: Local development server
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/documents:
    get:
      summary: List documents
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: archived
          schema: { type: boolean, default: false }
        - in: query
          name: pinned
          schema: { type: boolean, default: false }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
    post:
      summary: Create a document
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                template_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Document created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: CSRF token invalid
        "429":
          description: Rate limited
  /api/documents/{id}:
    get:
      summary: Get document by ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document details
        "401":
          description: Unauthorized
        "404":
          description: Document not found
    patch:
      summary: Update document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                is_pinned:
                  type: boolean
                is_archived:
                  type: boolean
      responses:
        "200":
          description: Document updated
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: CSRF token invalid
        "404":
          description: Document not found
    delete:
      summary: Delete document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
        "401":
          description: Unauthorized
        "403":
          description: CSRF token invalid
        "404":
          description: Document not found
  /api/documents/{id}/content:
    put:
      summary: Update document content
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 1000000
      responses:
        "200":
          description: Document content updated
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: CSRF token invalid
        "404":
          description: Document not found
  /api/auth/login:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid credentials
        "403":
          description: CSRF token invalid
        "429":
          description: Rate limited
    delete:
      summary: User logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful
        "403":
          description: CSRF token invalid
        "429":
          description: Rate limited
  /api/auth:
    post:
      summary: User signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                full_name:
                  type: string
      responses:
        "200":
          description: User created
        "400":
          description: Validation error
        "403":
          description: CSRF token invalid
        "429":
          description: Rate limited
  /api/health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                  checks:
                    type: object
                  timestamp:
                    type: string
        "503":
          description: Service degraded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      format: jwt
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
